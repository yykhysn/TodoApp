<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TodoApp</title>
    <link rel="stylesheet" type="text/css" href="/static/css/base.css">
    <link rel="stylesheet" type="text/css" href="/static/css/bootstrap.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">Welcome to Login</div>
            <div class="card-body">
                <form id="login-user-form">
                    <div class="form-group">
                        <label >Username</label>
                        <input type="text" name="user-username" class="form-control" autocomplete="user-username" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="user-password" class="form-control" autocomplete="user-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign in</button>
                </form>
            </div>
            <div class="card-footer text-muted">
                <a href="register.html">Don't have an account? Register Now</a>
            </div>
        </div>
    </div>
</body>
</html>
